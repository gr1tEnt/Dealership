<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-lg rounded-lg w-full max-w-2xl p-8">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-8">Create Account</h2>

    <form method="post" th:action="@{/register}" th:object="${registerDto}" class="space-y-5">

        <!-- Global Error Messages -->
        <div th:if="${#fields.hasGlobalErrors()}"
             class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6" role="alert">
            <strong class="font-bold">Error!</strong>
            <ul class="list-disc list-inside">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-6" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Username -->
        <div>
            <label for="username" class="block text-gray-700 font-medium mb-1">Username</label>
            <input type="text" id="username" th:field="*{username}" 
                   placeholder="Enter your username"
                   class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('username')}" class="text-red-500 text-xs mt-1" th:errors="*{username}"></p>
        </div>

        <!-- Email -->
        <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
            <input type="email" id="email" th:field="*{email}" 
                   placeholder="Enter your email"
                   class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('email')}" class="text-red-500 text-xs mt-1" th:errors="*{email}"></p>
        </div>

        <!-- Password -->
        <div>
            <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
            <input type="password" id="password" th:field="*{password}" 
                   placeholder="Enter your password"
                   class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('password')}" class="text-red-500 text-xs mt-1" th:errors="*{password}"></p>
        </div>

        <!-- Confirm Password -->
        <div>
            <label for="confirmPassword" class="block text-gray-700 font-medium mb-1">Confirm Password</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" 
                   placeholder="Confirm your password"
                   class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('confirmPassword')}" class="text-red-500 text-xs mt-1" th:errors="*{confirmPassword}"></p>
        </div>

        <!-- First Name -->
        <div>
            <label for="firstName" class="block text-gray-700 font-medium mb-1">First Name</label>
            <input type="text" id="firstName" th:field="*{firstName}" 
                   placeholder="Enter your first name"
                   class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('firstName')}" class="text-red-500 text-xs mt-1" th:errors="*{firstName}"></p>
        </div>

        <!-- Last Name -->
        <div>
            <label for="lastName" class="block text-gray-700 font-medium mb-1">Last Name</label>
            <input type="text" id="lastName" th:field="*{lastName}" 
                   placeholder="Enter your last name"
                   class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('lastName')}" class="text-red-500 text-xs mt-1" th:errors="*{lastName}"></p>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-4 pt-6">
            <a href="/"
               class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg shadow-sm hover:bg-gray-300 transition">
                Cancel
            </a>
            <button type="submit"
                    class="px-5 py-2 bg-indigo-600 text-white rounded-lg shadow-sm hover:bg-indigo-700 transition">
                Register
            </button>
        </div>

        <!-- Login Link -->
        <div class="text-center mt-6 pt-6 border-t border-gray-200">
            <p class="text-gray-600">
                Already have an account?
                <a href="/login" class="text-indigo-600 hover:text-indigo-800 font-medium">Login here</a>
            </p>
        </div>

    </form>
</div>

</body>
</html>
