<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white shadow-lg rounded-lg w-full max-w-2xl p-8 text-center">
    <h1 class="text-3xl font-bold text-red-600 mb-4" th:text="${errorTitle}">Error</h1>
    <p class="text-gray-700 mb-6" th:text="${errorMessage}">An error occurred</p>
    <a href="/cars" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
        Go to Cars List
    </a>
</div>
</body>
</html>
